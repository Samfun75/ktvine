[versions]
# The single source of truth for the published version. The release workflow checks the
# README install snippet against the tag.
ktvine = "1.0.0-RC2"

agp = "8.13.2"
kermit = "2.2.0"
kotlin = "2.4.20"
android-minSdk = "26"
android-compileSdk = "36"
coroutinesCore = "1.11.0"
vanniktechMavenPublish = "0.37.0"

dokka = "2.2.0"
ktor = "3.6.0"
serializationJson = "1.11.0"
xmlutil = "1.0.2"
ktlintGradle = "14.2.0"
wire = "7.0.3"
cryptography = "0.6.0"
bignum = "0.3.10"
androidxTestRunner = "1.7.0"

[libraries]
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesCore" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesCore" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
cryptography-provider-jdk-bc = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk-bc", version.ref = "cryptography" }
cryptography-provider-apple = { module = "dev.whyoleg.cryptography:cryptography-provider-apple", version.ref = "cryptography" }
cryptography-provider-cryptokit = { module = "dev.whyoleg.cryptography:cryptography-provider-cryptokit", version.ref = "cryptography" }
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[bundles]
cryptography = ["cryptography-core", "cryptography-provider-optimal"]

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }