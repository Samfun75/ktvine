name: Build

on:
  push:
    # ci/verify-ios is temporary scaffolding for the iOS proving run; drop it before merge.
    branches: [ "main", "ci/verify-ios" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `check` covers jvmTest, testAndroidHostTest, linuxX64Test, ktlintCheck and apiCheck.
          - name: check (jvm, android, linux)
            os: ubuntu-latest
            target: check
          # Apple targets can only be run on macOS.
          - name: iosSimulatorArm64Test
            os: macos-latest
            target: iosSimulatorArm64Test
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Diagnostic on the iOS job: confirm a simulator runtime exists before relying on it.
      - name: List available simulators
        if: matrix.target == 'iosSimulatorArm64Test'
        run: xcrun simctl list runtimes

      - name: Build
        run: ./gradlew ${{ matrix.target }} --stacktrace

      # A green iOS run with zero executed tests is a false pass - the whole point of this
      # job is to prove the crypto/XML paths run on-device, so assert they actually did.
      # Kept to bash 3.2 features: macOS runners have no globstar.
      - name: Confirm iOS tests actually ran
        if: matrix.target == 'iosSimulatorArm64Test'
        run: |
          echo "--- test-results directories present ---"
          find . -type d -path '*build/test-results*' 2>/dev/null | head -20

          reports=$(find . -type f -path '*build/test-results/iosSimulatorArm64Test/*' -name 'TEST-*.xml' 2>/dev/null)
          if [ -z "$reports" ]; then
            echo "::error::no iosSimulatorArm64Test result files were produced"
            exit 1
          fi

          # A heredoc terminator cannot be indented, and a pipe would lose $total to a
          # subshell, so the list goes through a file.
          echo "$reports" > "$RUNNER_TEMP/ios-reports.txt"
          total=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            skipped=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            total=$(( total + ${tests:-0} - ${skipped:-0} ))
            echo "  $(basename "$f"): ${tests:-0} tests, ${skipped:-0} skipped"
          done < "$RUNNER_TEMP/ios-reports.txt"

          echo "iOS tests actually executed: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::iosSimulatorArm64Test produced result files but ran 0 tests"
            exit 1
          fi

          # These are the paths iOS was unverified on: CMAC, a full offline licence, and XML.
          for expect in AesCmacTest CdmOfflineLicenseTest PlayreadyOracleTest; do
            if ! echo "$reports" | grep -q "$expect"; then
              echo "::error::$expect did not run on iOS - it is a load-bearing native check"
              exit 1
            fi
            echo "  ran on iOS: $expect"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
