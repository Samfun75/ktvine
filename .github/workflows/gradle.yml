name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Load-bearing classes every test job must show it executed; a task that runs nothing still exits green.
env:
  REQUIRED_TESTS: >-
    AesCmacTest CdmOfflineLicenseTest PlayreadyOracleTest CryptoProviderTest
    P256Test CdmOfflineExchangeTest RemoteCdmTest RemotePlayreadyCdmTest

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `check` covers jvmTest, testAndroidHostTest, linuxX64Test, ktlintCheck and the ABI check.
          - name: check (jvm, android host, linux)
            id: check
            os: ubuntu-latest
            target: check
          # iosArm64 needs a physical device and iosX64 an Intel simulator, so those two only link.
          - name: iOS (simulator arm64 tests, arm64 and x64 link)
            id: ios
            os: macos-latest
            target: iosSimulatorArm64Test linkDebugTestIosArm64 linkDebugTestIosX64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Diagnostic on the iOS job: confirm a simulator runtime exists before relying on it.
      - name: List available simulators
        if: matrix.id == 'ios'
        run: xcrun simctl list runtimes

      - name: Build
        run: ./gradlew ${{ matrix.target }} --stacktrace

      - name: Confirm JVM, Android host and linuxX64 tests actually ran
        if: matrix.id == 'check'
        run: |
          bash .github/scripts/assert-tests-ran.sh jvmTest build/test-results/jvmTest/ $REQUIRED_TESTS CryptoProviderJvmTest
          bash .github/scripts/assert-tests-ran.sh testAndroidHostTest build/test-results/testAndroidHostTest/ $REQUIRED_TESTS
          bash .github/scripts/assert-tests-ran.sh linuxX64Test build/test-results/linuxX64Test/ $REQUIRED_TESTS CryptoProviderLinuxTest

      - name: Confirm iOS tests actually ran
        if: matrix.id == 'ios'
        run: bash .github/scripts/assert-tests-ran.sh iosSimulatorArm64Test build/test-results/iosSimulatorArm64Test/ $REQUIRED_TESTS CryptoProviderIosTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.id }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The host-JVM Android suite runs on the desktop JDK's providers, so only ART shows what Android ships.
  android-device:
    name: Android device (emulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30 is the lowest level the suite can dex for; see deviceTestMinSdk in the module builds.
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedAndroidDeviceTest -PdeviceTestMinSdk=30 --stacktrace

      - name: Confirm device tests actually ran
        run: bash .github/scripts/assert-tests-ran.sh "Android device" androidTest-results/connected/ $REQUIRED_TESTS CryptoProviderAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-android-device
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
