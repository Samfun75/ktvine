name: Publish
on:
  release:
    types: [released, prereleased]
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Verify the version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CATALOG=$(sed -n 's/^ktvine = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          echo "tag=$TAG catalog=$CATALOG"
          if [ "$TAG" != "$CATALOG" ]; then
            echo "::error::Release tag $TAG does not match ktvine = $CATALOG in gradle/libs.versions.toml"
            exit 1
          fi
          if ! grep -q "io.github.samfun75:ktvine:$CATALOG" README.md; then
            echo "::error::README install snippet does not reference version $CATALOG"
            exit 1
          fi

      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          PUBLISH: true
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
